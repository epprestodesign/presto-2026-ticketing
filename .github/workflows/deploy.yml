name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

# Run JS-based actions on Node 24 (silences the Node 20 deprecation notice).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ONE command builds the whole site — Storybook plus every prototype
      # nested beneath it. Same script Netlify runs, so the two hosts cannot
      # drift; adding a prototype means adding it to scripts/build-site.mjs and
      # nowhere else. SITE_BASE is what differs: Pages serves this repo from a
      # sub-path, Netlify from the domain root.
      - name: Build the site (Storybook + all prototypes)
        run: npm run build:site
        env:
          SITE_BASE: "/presto-2026-ticketing"
          STORYBOOK_DISABLE_TELEMETRY: "1"
          VITE_IMAGERY_URL: "https://epprestodesign.github.io/presto-ds-imagery"
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      # The hub directory page is copied by the build script too.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
